services:
  - type: web
    name: desgrabador-youtube
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/render/project/src/.deno sh -s v2.3.0
      git clone --depth 1 --branch 1.3.1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/render/project/src/bgutil-ytdlp-pot-provider
      cd /opt/render/project/src/bgutil-ytdlp-pot-provider/server
      rm -f package-lock.json
      printf '%s' '{"name":"bgutil-ytdlp-pot-provider-server","version":"1.3.1","type":"module","private":true,"dependencies":{"axios":"^1.13.0","bgutils-js":"^3.2.0","commander":"^14.0.0","jsdom":"^27.0.0","proxy-agent":"^6.5.0","youtubei.js":"^16.0.0"}}' > package.json
      /opt/render/project/src/.deno/bin/deno install
    startCommand: PATH=/opt/render/project/src/.deno/bin:$PATH gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 youtubesubs_app:app
    autoDeployTrigger: commit
    healthCheckPath: /
