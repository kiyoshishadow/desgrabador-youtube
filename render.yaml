services:
  - type: web
    name: desgrabador-youtube
    runtime: python
    plan: free
    buildCommand: |
      set -e
      pip install -r requirements.txt
      curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/render/project/src/.deno sh -s v2.3.0
      cd /opt/render/project/src/bgutil_server
      rm -f package-lock.json deno.lock
      /opt/render/project/src/.deno/bin/deno install
      ls -la /opt/render/project/src/bgutil_server/src
    startCommand: PATH=/opt/render/project/src/.deno/bin:$PATH XDG_CACHE_HOME=/opt/render/project/src/.cache gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 youtubesubs_app:app
    autoDeployTrigger: commit
    healthCheckPath: /
