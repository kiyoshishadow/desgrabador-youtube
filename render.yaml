services:
  - type: web
    name: desgrabador-youtube
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && curl -fsSL https://deno.land/install.sh | DENO_INSTALL=/opt/render/project/src/.deno sh -s v2.3.0
    startCommand: PATH=/opt/render/project/src/.deno/bin:$PATH gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 youtubesubs_app:app
    autoDeployTrigger: commit
    healthCheckPath: /
